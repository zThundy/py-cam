services:
  app:
    container_name: esp32s3-cam-server
    image: zthundy/esp32s3-cam-server
    restart: unless-stopped

    # ports:
    #   - "3344:3344/tcp"
    #   - "3344:3344/udp"
    #   - "4512:4512/tcp"
    #   - "4512:4512/udp"

    network_mode: host

    user: "${UID}:${GID}"

    environment:
      LOGLEVEL: "INFO"
      LOGPATH: "logs"
      IMAGESPATH: "images"
      MAXIMAGES: 1200
      SERVICE_PORT: 4512
      MULTICASTGROUP: '239.1.2.3'
      MULTICASTPORT: 3344

    volumes:
      - images_data:/app/images
      - logs_data:/app/logs

volumes:
  images_data:
  logs_data: