<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CCTV Dashboard</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #000;
      --gray: #333;
      --text: #fff;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--background);
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      padding: clamp(10px, 2vw, 20px);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.25rem, 5vw, 2rem);
    }

    .grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr));
      align-content: start;
      gap: clamp(10px, 2vw, 16px);
      margin-top: 12px;
    }

    .tile {
      min-width: 0;
      background: #333;
      border: 2px solid #333;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .tile-header {
      padding: 8px;
      font-weight: bold;
    }

    .tile-body {
      min-height: 180px;
      aspect-ratio: 16 / 9;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .tile img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .placeholder {
      color: #aaa;
    }

    .tile-footer {
      padding: 6px;
      display: flex;
      justify-content: space-between;
    }

    .live-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00ff2a;
      margin-right: 5px;
    }

    .offline {
      background: red;
    }

    .header {
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .refresh {
      min-width: 44px;
      min-height: 44px;
      padding: 0;
      color: var(--text);
      font-size: 2rem;
      font-weight: bold;
      border: none;
      background-color: var(--background);
      cursor: pointer;
    }

    @media (max-width: 480px) {
      .tile-body {
        min-height: 150px;
      }

      .tile-footer {
        gap: 8px;
        flex-wrap: wrap;
      }

      .date {
        overflow-wrap: anywhere;
      }
    }
  </style>

</head>

<body>
  <div class="container">
    <div class="header">
      <h1>
        ESP CAM Monitor
      </h1>

      <button class="refresh" id="refresh">
        <!-- refresh icon -->
         <span>↻</span>
      </button>
    </div>
    <div id="grid" class="grid"></div>
  </div>

  <script>
    const grid = document.getElementById("grid");
    const refreshBtn = document.getElementById("refresh");
    const cameras = new Map();

    function createTile(id) {
      let tile = document.createElement("div");

      tile.className = "tile";
      tile.id = "tile-" + id;

      tile.innerHTML = `
        <div class="tile-header">
          Camera ${id}
        </div>

        <div class="tile-body">
          <img id="img-${id}">
          <div class="placeholder">
            Nessuna immagine
          </div>
        </div>

        <div class="tile-footer">
          <span class="date"></span>
          <span class="temp"></span>
        </div>
      `;
      grid.appendChild(tile);
      tile.onclick = () => {
        downloadVideo(id);
      };

      return tile;
    }

    function updateCamera(data) {
      let id = data.device_id;
      console.log("Got data from server for device " + id);
      let tile = cameras.get(id);

      if (!tile) {
        tile = createTile(id);
        cameras.set(id, tile);
      }

      let img = tile.querySelector("img");
      let placeholder = tile.querySelector(".placeholder");

      let header = tile.querySelector(".tile-header");
      let date = tile.querySelector(".date");
      let temp = tile.querySelector(".temp");

      let timestamp = new Date(data.timestamp);
      tile.dataset.timestamp = String(timestamp.getTime());

      header.innerHTML = `
        <span class="live-dot"></span>
        Camera ${id}
      `;

      // img.src = "/photo/" + encodeURIComponent(id) + "?t=" + Date.now();
      img.src = "data:image/jpeg;base64," + data.image;
      // img.src = data.image;

      img.style.display = "block";
      placeholder.style.display = "none";
      date.textContent = timestamp.toLocaleString();

      temp.textContent = "Temp: " + (data.temp || "0") + "°C";
      if (data.temp == "No data") temp.textContent = "No temperature data";
      updateCameraStatus(tile);
    }

    function updateCameraStatus(tile) {
      const timestamp = Number(tile.dataset.timestamp);
      const age = Date.now() - timestamp;
      const offline = !Number.isFinite(age) || age > 60_000 || age < -60_000;
      tile.querySelector(".live-dot").classList.toggle("offline", offline);
    }

    let ws;
    function connect() {
      const protocol = window.location.protocol === "https:" ? "wss://" : "ws://";
      ws = new WebSocket(protocol + window.location.host + "/stream");
      ws.onopen = () => { console.log("WebSocket connected"); };
      ws.onmessage = (event) => {
        try {
          console.log("Got data from websocket. " + new Date().toUTCString());
          let data = JSON.parse(event.data);
          console.log("Parsed data", data)
          updateCamera(data);
        } catch (e) {
          console.log("JSON error", e);
        }
      };

      ws.onerror = (e) => { console.log("WS error", e); };
      ws.onclose = () => {
        console.log("WS closed reconnect...");
        setTimeout(connect, 3000);
      };
    }

    function refresh() {
      fetch("/refresh")
        .then((r) => {
          if (!r.ok) throw Error("error while refreshing");
          return r.json();
        })
        .then(json => {
          console.log(json);
        })
    }

    function downloadVideo(id) {
      fetch("/download-video/" + encodeURIComponent(id))
        .then(r => {
          if (!r.ok) throw Error("video error");
          return r.blob();
        })
        .then(blob => {
          let url = URL.createObjectURL(blob);
          let a = document.createElement("a");
          a.href = url;
          a.download = id + "_" + Date.now() + ".mp4";
          a.click();

          setTimeout(() => URL.revokeObjectURL(url), 1000);
        })
        .catch(err => {
          console.log(err);
        });
    }

    refreshBtn.addEventListener("click", (e) => {
      e.preventDefault();
      refresh();
    })

    setInterval(refresh, 60 * 1000)
    setInterval(() => {
      cameras.forEach(updateCameraStatus);
    }, 5000);
    refresh();
    connect();
  </script>
</body>

</html>
